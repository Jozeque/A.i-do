<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>יוחננוף · מצגת הפקה</title>
<meta name="description" content="מצגת הפקה — תסריט, קאסט, מוצרים וסטוריבורד." />
<meta name="theme-color" content="#0E0D0C" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/yochananof-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   יוחננוף — מצגת הפקה
   שפה חזותית: תג המדף. שדה צהוב, קו מתאר שחור, סימון אדום — מתוך הלוגו עצמו.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  /* צבעי המותג — נלקחו מקובץ הלוגו */
  --y:      #F9DD05;
  --r:      #ED1D27;
  --ink:    #0E0D0C;
  --ink-2:  #181614;
  --ink-3:  #232019;
  --paper:  #FFFFFF;

  --txt:    #F3F1EB;
  --mute:   #918E86;
  --line:   rgba(243,241,235,.11);
  --line-2: rgba(243,241,235,.06);

  --display: 'Rubik', 'Segoe UI', Arial, sans-serif;
  --body:    'Assistant', 'Segoe UI', Arial, sans-serif;
  --data:    'IBM Plex Mono', ui-monospace, Menlo, monospace;

  --maxw: 1180px;
  --pad:  clamp(18px, 5vw, 56px);
  --gap:  clamp(28px, 4vw, 48px);
  --skew: -1.4deg;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--ink); color: var(--txt);
  font-family: var(--body); font-size: 16px; line-height: 1.62; font-weight: 400;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::selection { background: var(--y); color: var(--ink); }
:focus-visible { outline: 2px solid var(--y); outline-offset: 3px; border-radius: 2px; }
[id] { scroll-margin-top: 96px; }

.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--pad); }

/* ── התג: יסוד חוזר בכל המצגת ───────────────────────────────────────────── */
.tag {
  display: inline-flex; align-items: center; gap: .5em;
  background: var(--y); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: .9rem;
  padding: .38em .82em; border-radius: 7px;
  transform: skewY(var(--skew));
}
.tag > * { transform: skewY(calc(var(--skew) * -1)); display: block; }
.tag--key { border: 2px solid var(--ink); }         /* קו מתאר — רק על רקע בהיר */
.tag--sm  { font-size: .74rem; padding: .3em .6em; border-radius: 5px; }
.tag--ghost { background: transparent; color: var(--y); box-shadow: inset 0 0 0 1.5px var(--y); }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--r); flex: none; }

/* תוויות קטנות. הגופן המונו הוא לטיני בלבד — עברית תמיד בגופן הגוף */
.k { font-family: var(--body); font-size: .74rem; font-weight: 600; letter-spacing: .03em; color: var(--mute); }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

/* ── פס התקדמות + ניווט ─────────────────────────────────────────────────── */
.progress { position: fixed; inset: 0 0 auto auto; height: 3px; width: 0; background: var(--y); z-index: 90; }

.rail {
  position: fixed; z-index: 80;
  inset-inline-end: 20px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px; border-radius: 14px;
  background: rgba(14,13,12,.72); backdrop-filter: blur(14px);
  border: 1px solid var(--line);
}
.rail a {
  display: flex; align-items: center; gap: 10px; flex-direction: row-reverse;
  padding: 7px 10px; border-radius: 9px; font-size: .84rem; color: var(--mute);
  transition: color .2s ease, background .2s ease;
}
.rail a::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .45; flex: none; }
.rail a:hover { color: var(--txt); background: rgba(243,241,235,.05); }
.rail a.on { color: var(--y); }
.rail a.on::after { opacity: 1; background: var(--r); }

/* ── כריכה ──────────────────────────────────────────────────────────────── */
.cover { min-height: 100svh; display: flex; align-items: center; padding-block: clamp(70px, 12vh, 130px); }
.cover__logo { width: clamp(200px, 28vw, 360px); margin-bottom: clamp(28px, 5vh, 52px); }
.cover__tag {
  font-size: clamp(1.55rem, 4.6vw, 4.2rem); font-weight: 900; line-height: 1.08;
  padding: .32em .56em; border-radius: 12px; letter-spacing: -.015em;
}
/* כותרת ארוכה נשברת לשורות שוות במקום להשאיר מילה בודדת בשורה נפרדת */
.cover__tag > span { text-wrap: balance; }
.cover__line { margin-top: clamp(20px, 3vh, 30px); font-size: clamp(1rem, 2vw, 1.2rem); color: var(--mute); max-width: 46ch; }

/* פס המפרט — נמתח על כל הרוחב כמו תווית מדף, עם מפרידים בין התאים */
.spec {
  margin-top: clamp(34px, 6vh, 58px);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line);
}
.spec > div {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 22px;
  padding-inline-start: clamp(14px, 2.2vw, 28px); border-inline-start: 1px solid var(--line-2);
}
.spec > div:first-child { border-inline-start: 0; padding-inline-start: 0; }
.spec__v { font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.spec__price { font-family: var(--display); font-weight: 900; color: var(--r); font-size: clamp(2rem, 5vw, 3.1rem); line-height: .82; letter-spacing: -.03em; }
.spec__price sup { font-size: .38em; vertical-align: super; margin-inline-start: .06em; }

.agenda { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--mute); font-size: .92rem; }
.agenda span:not(:last-child)::after { content: "·"; margin-inline-start: 18px; color: var(--y); }
.agenda a:hover { color: var(--txt); }

/* ── כותרת פרק ──────────────────────────────────────────────────────────── */
.sec { padding-block: clamp(58px, 9vh, 104px); border-top: 1px solid var(--line-2); }
.sec__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px 20px; margin-bottom: clamp(26px, 4vh, 40px); }
.sec__title { font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 4.2vw, 2.7rem); letter-spacing: -.02em; }
.sec__en { font-family: var(--data); font-size: .74rem; letter-spacing: .22em; color: var(--y); text-transform: uppercase; }
.sec__note { flex: 1 1 260px; color: var(--mute); font-size: .96rem; text-align: start; }

/* ── תסריט — הטבלה כפי שהיא במסמך: שומעים | רואים ───────────────────────── */
.sc__head, .sc__row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3.2vw, 46px); }
.sc__head { padding-bottom: 12px; }
.sc__row { padding-block: clamp(18px, 2.8vh, 28px); border-top: 1px solid var(--line); }
.sc__row:last-child { border-bottom: 1px solid var(--line); }
.sc__hear, .sc__see { white-space: pre-line; line-height: 1.62; }
.sc__see, .sc__head span:last-child {
  border-inline-start: 1px solid var(--line-2); padding-inline-start: clamp(20px, 3.2vw, 46px);
}
.sc__row--flash { animation: flash 1.5s ease; }
@keyframes flash { 0%, 60% { background: rgba(249,221,5,.09); } 100% { background: transparent; } }

/* ── שבבי קישור ─────────────────────────────────────────────────────────── */
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 14px; }
.chip {
  font-family: var(--data); font-size: .72rem; font-weight: 500; direction: ltr;
  padding: 3px 9px; border-radius: 5px; color: var(--y);
  box-shadow: inset 0 0 0 1px rgba(249,221,5,.4); transition: background .18s ease, color .18s ease;
}
button.chip:hover { background: var(--y); color: var(--ink); }

/* ── רשתות ──────────────────────────────────────────────────────────────── */
.grid { display: grid; gap: clamp(14px, 2.2vw, 24px); }
.grid--prod   { grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }
.grid--frames { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

/* ── מדיה + מציין "ממתין לחומר" ─────────────────────────────────────────── */
.media { position: relative; overflow: hidden; background: var(--ink-2); border-radius: 10px; }
.media img { width: 100%; height: 100%; object-fit: cover; }
.media--fit img { object-fit: contain; padding: 12%; }
/* צילום אמיתי (לא פאקשוט חתוך) — שוליים קטנים יותר ופינות מעוגלות */
.media--photo img { padding: 7%; border-radius: 9px; }
.ph {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px;
  background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(249,221,5,.045) 9px 18px);
  box-shadow: inset 0 0 0 1px rgba(249,221,5,.22);
  border-radius: inherit;
}
.ph b { font-family: var(--display); font-weight: 900; font-size: 1.5rem; color: rgba(249,221,5,.5); }
.ph span { font-family: var(--body); font-size: .76rem; font-weight: 600; color: rgba(249,221,5,.5); }
.media--light .ph { background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(14,13,12,.05) 9px 18px); box-shadow: inset 0 0 0 1px rgba(14,13,12,.14); }
.media--light .ph b { color: rgba(14,13,12,.3); }
.media--light .ph span { color: rgba(14,13,12,.45); }

/* ── קאסט — בלוק לכל דמות, כל אופציות הליהוק גלויות ─────────────────────── */
.cast-row { padding-block: clamp(22px, 3.4vh, 34px); border-top: 1px solid var(--line); }
.cast-row:first-child { border-top: 0; padding-block-start: 0; }
.cast-row__head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.cast-row__name { font-family: var(--display); font-weight: 800; font-size: clamp(1.15rem, 2.2vw, 1.45rem); }
.cast-row__status { font-size: .86rem; color: var(--mute); }
.cast-row__status.is-picked { color: var(--y); font-weight: 700; }
.cast-row__head .chips { margin-top: 0; }
.cast-row__note { margin-top: 9px; font-size: .95rem; color: #C5C2BA; max-width: 78ch; }
.cast-row__opts { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); gap: 12px; }
.opt { position: relative; }
.opt__img { aspect-ratio: 4 / 3; }
.opt__tag {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px;
  font-family: var(--body); font-weight: 600; font-size: .74rem; line-height: 1.3;
  padding: 3px 9px; border-radius: 5px; background: rgba(10,10,9,.74); color: var(--txt);
}
.opt.is-pick .opt__tag { background: var(--y); color: var(--ink); }
.opt.is-pick .opt__img { box-shadow: 0 0 0 2px var(--y); }

/* ── מוצרים: משבצת לבנה, שפת הדפוס של הרשת ─────────────────────────────── */
.prod { position: relative; background: var(--paper); color: var(--ink); border-radius: 12px; overflow: hidden; }
.prod__img { aspect-ratio: 1 / 1; background: var(--paper); border-radius: 0; }
.prod__body { padding: 4px 15px 17px; }
.prod__name { font-family: var(--display); font-weight: 800; font-size: 1.05rem; }
.prod__meta { font-size: .84rem; color: #63615C; margin-top: 3px; }
.prod__tag { position: absolute; inset-block-start: 11px; inset-inline-end: 11px; }
.prod .chips { margin-top: 11px; }
.prod .chip { color: #3C3A36; box-shadow: inset 0 0 0 1px rgba(14,13,12,.22); }
.prod button.chip:hover { background: var(--ink); color: var(--y); box-shadow: none; }

/* ── לוקיישן ────────────────────────────────────────────────────────────── */
.loc-grid { display: grid; gap: clamp(16px, 2.4vw, 26px); grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); }
.loc__img { aspect-ratio: 16 / 9; }
.loc__cap { margin-top: 12px; font-size: .96rem; color: #C5C2BA; max-width: 74ch; }

/* ── סטוריבורד ──────────────────────────────────────────────────────────── */
.frame__btn { display: block; width: 100%; aspect-ratio: 16 / 9; cursor: zoom-in; }
.frame__btn img { transition: transform .4s cubic-bezier(.2,.7,.3,1); }
.frame__btn:hover img { transform: scale(1.03); }
.frame__n { position: absolute; inset-block-start: 9px; inset-inline-start: 9px; }
.frame__cap { padding-top: 11px; }
.frame__meta { font-family: var(--body); font-weight: 600; font-size: .8rem; color: var(--y); }
.frame__desc { margin-top: 5px; font-size: .93rem; color: #C5C2BA; line-height: 1.5; }

/* ── סגירה ──────────────────────────────────────────────────────────────── */
.close { padding-block: clamp(64px, 11vh, 120px) clamp(50px, 8vh, 84px); border-top: 1px solid var(--line-2); }
.close__title { font-family: var(--display); font-weight: 900; font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: -.02em; }
.close__text { margin-top: 14px; color: var(--mute); max-width: 46ch; }
.close__grid { margin-top: clamp(34px, 5vh, 52px); display: flex; flex-wrap: wrap; gap: 14px 46px; }
.close__grid div { display: flex; flex-direction: column; gap: 4px; }
.close__grid b { font-family: var(--display); font-weight: 800; font-size: 1rem; }
.foot { margin-top: clamp(40px, 6vh, 66px); padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
/* סגירה ללא בלוק טקסט — שורת פוטר בלבד, בלי חלל מיותר */
.close--bare { padding-block: clamp(30px, 5vh, 52px); }
.close--bare .foot { margin-top: 0; padding-top: 0; border-top: 0; }
.foot img { width: 104px; opacity: .8; }
.foot-mark { font-family: var(--display); font-weight: 900; font-size: 1.2rem; letter-spacing: -.015em; }
.foot p { font-family: var(--body); font-size: .82rem; color: var(--mute); }

/* ── תיבת תצוגה ─────────────────────────────────────────────────────────── */
/* margin:auto חייב להיכתב במפורש — האיפוס הגלובלי מבטל את מרכוז ברירת המחדל של dialog */
.lb {
  width: min(1180px, 94vw, 115vh); max-width: none; margin: auto;
  border: 0; padding: 0; background: transparent; color: var(--txt); overflow: visible;
}
.lb:focus, .lb:focus-visible { outline: none; }
.lb::backdrop { background: rgba(8,8,7,.96); }
.lb__img { aspect-ratio: 16 / 9; border-radius: 12px; }
.lb__bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-top: 16px; }
.lb__bar > div:first-child { min-width: 0; }
.lb__meta { font-family: var(--body); font-weight: 600; font-size: .84rem; color: var(--y); }
.lb__desc { margin-top: 6px; font-size: 1.02rem; max-width: 60ch; }
.lb__nav { display: flex; gap: 8px; flex: none; }
.lb__nav button { width: 42px; height: 42px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; transition: background .18s ease, border-color .18s ease; }
.lb__nav button:hover { background: rgba(243,241,235,.08); border-color: var(--txt); }
.lb__close {
  display: block; margin-inline-start: auto; margin-block-end: 10px; padding: 2px 4px;
  font-family: var(--body); font-weight: 600; font-size: .82rem; color: var(--mute);
}
.lb__close:hover { color: var(--txt); }

/* ── תווית מצב תבנית ────────────────────────────────────────────────────── */
.draft {
  position: fixed; inset-block-end: 14px; inset-inline-start: 14px; z-index: 85;
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px;
  background: rgba(14,13,12,.82); backdrop-filter: blur(10px); border: 1px solid rgba(249,221,5,.3);
  font-family: var(--body); font-weight: 600; font-size: .78rem; color: var(--y);
}

/* ── חשיפה בגלילה ───────────────────────────────────────────────────────── */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1); }
.rv.in { opacity: 1; transform: none; }

/* ── רספונסיבי ──────────────────────────────────────────────────────────── */
@media (max-width: 1200px) {
  .rail {
    inset: auto 12px 12px 12px; top: auto; transform: none; flex-direction: row;
    justify-content: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail a { flex-direction: row; gap: 7px; padding: 7px 11px; font-size: .8rem; white-space: nowrap; }
  .rail a::after { display: none; }
  .rail a.on { background: var(--y); color: var(--ink); }
  .draft { inset-block-end: 66px; }
  .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 24px; }
  .spec > div:nth-child(odd) { border-inline-start: 0; padding-inline-start: 0; }
  body { padding-bottom: 62px; }
}
@media (max-width: 700px) {
  /* טור אחד — כל תא מקבל את התווית שלו */
  .sc__head { display: none; }
  .sc__row { grid-template-columns: 1fr; gap: 14px; }
  .sc__see { border-inline-start: 0; padding-inline-start: 0; }
  .sc__hear::before { content: "שומעים"; }
  .sc__see::before { content: "רואים"; }
  .sc__hear::before, .sc__see::before {
    display: block; margin-bottom: 5px; font-size: .74rem; font-weight: 600; color: var(--mute);
  }
}
@media (max-width: 560px) {
  .grid--frames { grid-template-columns: 1fr; }
  .grid--prod { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .cast-row__opts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cast-row__note { font-size: .88rem; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .rv { opacity: 1; transform: none; transition: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── הדפסה / PDF ────────────────────────────────────────────────────────── */
@media print {
  @page { margin: 13mm; }
  /* היפוך הערכות הצבע — הצהוב, האדום והשחור של המותג נשארים כמו שהם */
  :root {
    --txt: #14130F; --mute: #5E5C56; --line: #D4D2CC; --line-2: #E7E5DF;
    --ink-2: #F1F0EC; --ink-3: #E8E6E1;
  }
  body { background: #fff; color: var(--txt); padding-bottom: 0; }
  .rail, .progress, .draft, .lb { display: none !important; }
  .rv { opacity: 1 !important; transform: none !important; }
  .cover { min-height: 0; padding-block: 0 20px; }
  /* כל פרק פותח עמוד חדש; בלוקים לא נחתכים באמצע */
  .sec, .close { padding-block: 0 20px; border-top: 0; break-before: page; }
  .close--bare { break-before: auto; padding-block-start: 18px; }   /* לא לבזבז עמוד על פוטר */
  .sec__head { padding-block-end: 4px; }
  .sc__row, .cast-row, .frame, .prod, .loc, .sec__head { break-inside: avoid; }
  .grid--frames { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cast-row:first-child { padding-block-start: 0; }
  .cast-row__note, .frame__desc, .loc__cap { color: #3A3833; }
  .sec__en, .frame__meta, .lb__meta, .ph b, .ph span { color: #8A7400; }
  .chip { color: #3A3833; box-shadow: inset 0 0 0 1px #B9B7B1; }
  .tag--ghost { color: #7A6700; box-shadow: inset 0 0 0 1.5px #C9AE00; }
  .opt__tag { background: #14130F; color: #fff; }
  .opt.is-pick .opt__tag { background: var(--y); color: var(--ink); }
  .ph { box-shadow: inset 0 0 0 1px #D9D7D1; }
  .foot img { filter: invert(1); }
}
</style>
</head>

<body>
<div class="progress" id="progress" role="presentation"></div>
<nav class="rail" id="rail" aria-label="ניווט בין פרקים"></nav>

<main id="deck">
  <noscript><p style="padding:40px">להצגת המצגת יש לאפשר JavaScript.</p></noscript>
</main>

<dialog class="lb" id="lb" tabindex="-1" aria-label="תצוגת פריים">
  <button class="lb__close" id="lbClose" type="button">סגירה (Esc)</button>
  <div class="media lb__img" id="lbMedia"></div>
  <div class="lb__bar">
    <div>
      <p class="lb__meta" id="lbMeta"></p>
      <p class="lb__desc" id="lbDesc"></p>
    </div>
    <div class="lb__nav">
      <button type="button" id="lbPrev" aria-label="פריים קודם">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" id="lbNext" aria-label="פריים הבא">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </div>
</dialog>

<script src="deck-data.js"></script>
<script>
(function () {
  'use strict';

  /* ── עזרים ───────────────────────────────────────────────────────────── */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');


  /** משבצת מדיה — תמונה אם יש, אחרת מציין "ממתין לחומר". extra = תוכן נוסף בתוך המשבצת */
  function media(src, alt, cls, label, extra) {
    const inner = src
      ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" data-ph="' + esc(label) + '">'
      : ph(label);
    return '<div class="media ' + (cls || '') + '">' + inner + (extra || '') + '</div>';
  }
  const ph = (label) => '<div class="ph">' + (label ? '<b>' + esc(label) + '</b>' : '') +
                        '<span>ממתין לחומר</span></div>';

  /* שבב מקשר הופך לתווית רגילה אם הפרק שאליו הוא מפנה לא נמצא במצגת */
  const NEEDS = { frame: 'storyboard', scene: 'script' };
  const hasSection = (id) => (DECK.sections || []).some((s) => s.id === id);
  const chips = (label, items, kind) => {
    if (!items || !items.length) return '';
    const live = hasSection(NEEDS[kind]);
    const one = (n) => live
      ? '<button class="chip" type="button" data-' + kind + '="' + n + '">' + n + '</button>'
      : '<span class="chip is-static">' + n + '</span>';
    return '<div class="chips"><span class="k">' + esc(label) + '</span>' + items.map(one).join('') + '</div>';
  };

  const scenes = (DECK.script || []).map((s, i) => Object.assign({}, s, { n: i + 1 }));
  const spotLength = Number(DECK.duration) || 0;   /* אורך הסרטון שמופיע בכריכה */

  const frames = (DECK.storyboard || []).map((f, i) => Object.assign({}, f, { n: i + 1 }));

  /* ── כריכה ───────────────────────────────────────────────────────────── */
  function cover() {
    const agenda = DECK.sections.map((s) =>
      '<span><a href="#' + s.id + '">' + esc(s.he) + '</a></span>').join('');
    return '' +
      '<section class="cover" id="cover"><div class="wrap">' +
        '<img class="cover__logo rv" src="' + esc(DECK.logo) + '" alt="' + esc(DECK.client) + '">' +
        '<h1 class="tag cover__tag rv"><span>' + esc(DECK.campaign) + '</span></h1>' +
        '<p class="cover__line rv">' + esc(DECK.line) + '</p>' +
        '<div class="spec rv">' +
          cell('פורמט', '<span class="spec__v">' + esc(DECK.format) + '</span>') +
          cell('אורך', '<span class="spec__price num">' + spotLength + '<sup>&Prime;</sup></span>') +
          cell('תאריך', '<span class="spec__v">' + esc(DECK.date) + '</span>') +
          cell('הפקה', '<span class="spec__v">' + esc(DECK.production) + '</span>') +
        '</div>' +
        '<nav class="agenda rv" aria-label="תוכן המצגת">' + agenda + '</nav>' +
      '</div></section>';
  }
  const cell = (k, v) => '<div><span class="k">' + esc(k) + '</span>' + v + '</div>';

  const head = (s) =>
    '<header class="sec__head rv">' +
      '<h2 class="sec__title">' + esc(s.he) + '</h2>' +
      '<span class="sec__en">' + esc(s.en) + '</span>' +
      (s.note ? '<p class="sec__note">' + esc(s.note) + '</p>' : '') +
    '</header>';

  /* ── תסריט ─── הטבלה מהמסמך כמו שהיא, בלי עיבוד ──────────────────────── */
  function script(s) {
    const rows = scenes.map((sc) =>
      '<div class="sc__row rv" id="scene-' + sc.n + '">' +
        '<div class="sc__hear">' + esc(sc.hear) + '</div>' +
        '<div class="sc__see">' + esc(sc.see) + '</div>' +
      '</div>').join('');
    return sec(s,
      '<div class="sc__head rv"><span class="k">שומעים</span><span class="k">רואים</span></div>' + rows);
  }

  /* ── קאסט ─── בלוק לכל דמות, כל האופציות גלויות (המצגת מיוצאת ל-PDF) ──── */
  function cast(s) {
    const rows = (DECK.cast || []).map((c) => {
      const opts = c.imgs && c.imgs.length ? c.imgs : (c.img ? [c.img] : []);
      const status = c.picked ? 'ליהוק נבחר'
        : (opts.length > 1 ? opts.length + ' אופציות לבחירה' : 'ממתין לליהוק');
      const tiles = opts.map((src, i) => {
        const pick = c.picked && i === 0;
        return '<div class="opt' + (pick ? ' is-pick' : '') + '">' +
          media(src, c.name + ' — אופציה ' + (i + 1), 'opt__img', '',
            '<span class="opt__tag">' + (pick ? 'נבחר' : 'אופציה ' + (i + 1)) + '</span>') +
        '</div>';
      }).join('');
      return '<article class="cast-row rv">' +
        '<header class="cast-row__head">' +
          '<h3 class="cast-row__name">' + esc(c.name) + '</h3>' +
          (c.role ? '<span class="tag tag--sm' + (c.role === 'ראשי' ? '' : ' tag--ghost') + '">' +
                    '<span>' + esc(c.role) + '</span></span>' : '') +
          '<span class="cast-row__status' + (c.picked ? ' is-picked' : '') + '">' + esc(status) + '</span>' +
          chips('סצנות', c.scenes, 'scene') +
        '</header>' +
        (c.note ? '<p class="cast-row__note">' + esc(c.note) + '</p>' : '') +
        '<div class="cast-row__opts">' + tiles + '</div>' +
      '</article>';
    }).join('');
    return sec(s, '<div class="cast-list">' + rows + '</div>');
  }

  /* ── מוצרים ──────────────────────────────────────────────────────────── */
  function products(s) {
    const tiles = (DECK.products || []).map((p) =>
      '<article class="prod rv">' +
        media(p.img, p.name, 'prod__img media--fit media--light' + (p.photo ? ' media--photo' : ''), '') +
        (p.tag ? '<span class="tag tag--key tag--sm prod__tag"><span>' + esc(p.tag) + '</span></span>' : '') +
        '<div class="prod__body">' +
          '<h3 class="prod__name">' + esc(p.name) + '</h3>' +
          (p.meta ? '<p class="prod__meta">' + esc(p.meta) + '</p>' : '') +
          chips('פריימים', p.frames, 'frame') +
        '</div>' +
      '</article>').join('');
    return sec(s, '<div class="grid grid--prod">' + tiles + '</div>');
  }

  /* ── לוקיישן ─── שם הפונקציה אינו location כדי לא להסתיר את window.location ── */
  function locationSec(s) {
    const shots = (DECK.location || []).map((L) =>
      '<figure class="loc rv">' +
        media(L.img, L.caption || 'לוקיישן', 'loc__img', '') +
        (L.caption ? '<figcaption class="loc__cap">' + esc(L.caption) + '</figcaption>' : '') +
      '</figure>').join('');
    return sec(s, '<div class="loc-grid">' + shots + '</div>');
  }

  /* ── סטוריבורד ───────────────────────────────────────────────────────── */
  function storyboard(s) {
    const cards = frames.map((f) =>
      '<figure class="frame rv">' +
        '<button class="frame__btn media" type="button" data-open="' + f.n + '" ' +
          'aria-label="הגדלת פריים ' + f.n + '">' +
          (f.img
            ? '<img src="' + esc(f.img) + '" alt="פריים ' + f.n + ' — ' + esc(f.desc) + '" data-ph="">'
            : ph('')) +
          '<span class="tag tag--key tag--sm frame__n"><span class="num">' + f.n + '</span></span>' +
        '</button>' +
        '<figcaption class="frame__cap">' +
          '<p class="frame__meta">' + meta(f) + '</p>' +
          '<p class="frame__desc">' + esc(f.desc) + '</p>' +
        '</figcaption>' +
      '</figure>').join('');
    return sec(s, '<div class="grid grid--frames">' + cards + '</div>');
  }
  const meta = (f) => [f.shot, f.move, (f.dur ? f.dur + '″' : ''), (f.scene ? 'סצנה ' + f.scene : '')]
    .filter(Boolean).map(esc).join('  ·  ');

  const sec = (s, inner) =>
    '<section class="sec" id="' + s.id + '"><div class="wrap">' + head(s) + inner + '</div></section>';

  /* ── סגירה ───────────────────────────────────────────────────────────── */
  function close() {
    const c = DECK.close || {};
    const list = (c.contact || []).filter((x) => x.value)
      .map((x) => '<div><span class="k">' + esc(x.label) + '</span><b>' + esc(x.value) + '</b></div>').join('');
    /* בלי כותרת, טקסט ואנשי קשר — המצגת נסגרת בשורת הפוטר בלבד */
    const bare = !c.title && !c.text && !list;
    return '' +
      '<section class="close' + (bare ? ' close--bare' : '') + '" id="close"><div class="wrap">' +
        (c.title ? '<h2 class="close__title rv">' + esc(c.title) + '</h2>' : '') +
        (c.text ? '<p class="close__text rv">' + esc(c.text) + '</p>' : '') +
        (list ? '<div class="close__grid rv">' + list + '</div>' : '') +
        '<div class="foot">' +
          (DECK.wordmark
            ? '<img src="' + esc(DECK.wordmark) + '" alt="' + esc(DECK.production) + '">'
            : '<span class="foot-mark">' + esc(DECK.production) + '</span>') +
          '<p>' + esc(DECK.client) + ' &nbsp;·&nbsp; ' + esc(DECK.date) + '</p>' +
        '</div>' +
      '</div></section>';
  }

  /* ── בנייה ───────────────────────────────────────────────────────────── */
  const render = { script: script, cast: cast, location: locationSec, products: products, storyboard: storyboard };
  $('#deck').innerHTML = cover() +
    DECK.sections.map((s) => (render[s.id] ? render[s.id](s) : '')).join('') + close();

  $('#rail').innerHTML = DECK.sections
    .map((s) => '<a href="#' + s.id + '" data-to="' + s.id + '">' + esc(s.he) + '</a>').join('');

  if (DECK.draft) {
    document.body.insertAdjacentHTML('beforeend',
      '<div class="draft"><span class="dot"></span>מצב תבנית — לא לשליחה</div>');
  }
  document.title = DECK.client + ' · ' + DECK.campaign + ' · מצגת הפקה';

  /* הפרקים נבנים ב-JS, ולכן קישור ישיר (‎#storyboard) צריך גלילה ידנית אחרי הבנייה */
  if (location.hash) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: 'instant', block: 'start' }));
  }

  /* ── התקדמות + מיקום נוכחי ───────────────────────────────────────────── */
  const bar = $('#progress');
  const links = $$('#rail a');
  let ticking = false;

  function onScroll() {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + '%';
    ticking = false;
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();

  if (!('IntersectionObserver' in window)) { $$('.rv').forEach((n) => n.classList.add('in')); }

  const spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.classList.toggle('on', a.dataset.to === e.target.id));
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  DECK.sections.forEach((s) => { const n = document.getElementById(s.id); if (n) spy.observe(n); });

  const reveal = new IntersectionObserver((entries, o) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); o.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' });
  $$('.rv').forEach((n, i) => { n.style.transitionDelay = Math.min(i % 8, 5) * 45 + 'ms'; reveal.observe(n); });

  /* קובץ תמונה חסר או שבור — נופל חזרה למציין "ממתין לחומר" */
  $$('#deck img[data-ph]').forEach((img) => {
    img.addEventListener('error', function () {
      const box = this.parentNode;
      this.remove();
      box.insertAdjacentHTML('afterbegin', ph(this.dataset.ph));
    });
  });

  /* קפיצה לשורת התסריט (משבב "סצנות" בקאסט) עם הבזק קצר */
  function goto(id) {
    const n = document.getElementById(id);
    if (!n) return;
    n.scrollIntoView({ behavior: 'smooth', block: 'center' });
    n.classList.remove('sc__row--flash');
    void n.offsetWidth;
    n.classList.add('sc__row--flash');
    setTimeout(() => n.classList.remove('sc__row--flash'), 1600);
  }

  /* ── תיבת תצוגה ──────────────────────────────────────────────────────── */
  const lb = $('#lb');
  let at = 0;

  function open(n) {
    at = Math.max(0, Math.min(frames.length - 1, n - 1));
    paint();
    if (!lb.open) {
      if (lb.showModal) lb.showModal(); else lb.open = true;
      lb.focus();   /* מיקוד על התיבה עצמה, כדי שלא יידלק טבעת מיקוד על כפתור הסגירה */
    }
  }
  function paint() {
    const f = frames[at];
    if (!f) return;
    $('#lbMedia').innerHTML = f.img
      ? '<img src="' + esc(f.img) + '" alt="פריים ' + f.n + '">'
      : ph('');
    $('#lbMeta').innerHTML = 'פריים ' + f.n + ' / ' + frames.length + '  ·  ' + meta(f);
    $('#lbDesc').textContent = f.desc || '';
  }
  const step = (d) => { at = (at + d + frames.length) % frames.length; paint(); };

  document.addEventListener('click', (e) => {
    const openBtn = e.target.closest('[data-open]');
    if (openBtn) { open(Number(openBtn.dataset.open)); return; }

    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.dataset.frame) open(Number(chip.dataset.frame));
    else if (chip.dataset.scene) goto('scene-' + chip.dataset.scene);
  });
  $('#lbNext').addEventListener('click', () => step(1));
  $('#lbPrev').addEventListener('click', () => step(-1));
  $('#lbClose').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });

  /* ── מקלדת: שלט מצגת + חצים ──────────────────────────────────────────── */
  const stops = ['cover'].concat(DECK.sections.map((s) => s.id)).concat(['close']);

  function jump(d) {
    const y = window.scrollY + window.innerHeight * 0.35;
    let i = 0;
    stops.forEach((id, k) => { const n = document.getElementById(id); if (n && n.offsetTop <= y) i = k; });
    const next = document.getElementById(stops[Math.max(0, Math.min(stops.length - 1, i + d))]);
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (lb.open) {
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   { e.preventDefault(); step(-1); }
      return;
    }
    if (e.key === 'PageDown' || e.key === 'n') { e.preventDefault(); jump(1); }
    if (e.key === 'PageUp'   || e.key === 'p') { e.preventDefault(); jump(-1); }
    if (e.key === 'Home') { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); }
    if (/^[1-9]$/.test(e.key)) {
      const s = DECK.sections[Number(e.key) - 1];
      if (s) { e.preventDefault(); document.getElementById(s.id).scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
})();
</script>
</body>
</html>

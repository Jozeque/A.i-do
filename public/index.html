<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Studio</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=31" />
</head>
<body>
  <div id="app">
    <!-- Collapse the sidebar before the first paint if it was left collapsed (no flash). -->
    <script>try { if (localStorage.getItem('avs:sidebar') === 'collapsed') document.getElementById('app').classList.add('sb-collapsed'); } catch {}</script>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">◐</div>
        <div class="brand-text">
          <div class="brand-name">SHYOW</div>
          <div class="brand-sub" id="modelLine">loading…</div>
        </div>
        <button class="sb-toggle" id="sidebarToggle" type="button" title="Collapse the sidebar" aria-label="Collapse the sidebar" aria-expanded="true">«</button>
      </div>

      <button class="new-project-btn" id="newProjectBtn" title="New project"><span class="sb-ico">＋</span><span class="sb-label"> New project</span></button>

      <input class="project-search" id="projectSearch" type="search" placeholder="Search projects or clients…" autocomplete="off" aria-label="Search projects or clients" />

      <!-- Projects, grouped under their client -->
      <div class="project-list" id="projectList"></div>

      <div class="sidebar-foot">
        <button class="sidebar-nav-btn" id="crmBtn" title="CRM"><span class="sb-ico">📇</span><span class="sb-label">&nbsp;CRM</span><span class="crm-badge hidden" id="crmBadge"></span></button>
        <button class="sidebar-nav-btn" id="showcaseBtn" title="Showcase"><span class="sb-ico">🎬</span><span class="sb-label">&nbsp;Showcase</span></button>
        <button class="sidebar-nav-btn" id="expensesBtn" title="Expenses"><span class="sb-ico">💰</span><span class="sb-label">&nbsp;Expenses</span></button>
        <span id="keyStatus" class="key-status"></span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">◐</div>
        <h1>Your production cockpit</h1>
        <p>Create a project to start generating Nano Banana frames, Seedance &amp; Kling video prompts, tagged asset sheets, and managing your renders — all in one place.</p>
        <button class="new-project-btn big" id="newProjectBtn2">＋ Create your first project</button>
      </div>

      <div class="workspace hidden" id="workspace">
        <header class="ws-header">
          <div class="ws-title">
            <div class="ws-eyebrow">
              <input id="projectClientInput" class="project-client-input" list="clientList" placeholder="＋ Add a client" autocomplete="off" aria-label="Client" title="The client this project belongs to — the sidebar groups projects by it" />
              <span class="ws-meta" id="wsMeta"></span>
            </div>
            <input id="projectNameInput" class="project-name-input" aria-label="Project name" />
          </div>
          <datalist id="clientList"></datalist>
          <!-- Tabs come in groups (Images / Videos / Assets); only the open group's tabs show (data-group sets which). -->
          <nav class="ws-nav">
            <div class="ws-groups" id="wsGroups">
              <button class="ws-group active" data-group="image" type="button">🖼&nbsp;Images</button>
              <button class="ws-group" data-group="video" type="button">🎬&nbsp;Videos</button>
              <button class="ws-group" data-group="assets" type="button">📁&nbsp;Assets</button>
            </div>
            <div class="ws-tabs" id="wsTabs">
              <button class="tab active" data-tab="nb-frames" data-group="image">NB&nbsp;Frames</button>
              <!-- one tab, two engines: a toggle inside picks the Nano Banana or the GPT advisor -->
              <button class="tab" data-tab="nb-advisor" data-also="gpt-advisor" data-group="image">Advisor&nbsp;&amp;&nbsp;Tweaks</button>
              <button class="tab" data-tab="storyboard" data-group="image">Storyboard</button>
              <button class="tab" data-tab="swap" data-group="image">Swap&nbsp;/&nbsp;Edit</button>
              <button class="tab" data-tab="generate" data-group="image">Nano&nbsp;Banana&nbsp;2</button>
              <button class="tab" data-tab="library" data-group="image">Library</button>
              <!-- one brief for every video model — Seedance 2.0 / 2.5 or Kling 3.0, picked at its end (the chat id stays "seedance") -->
              <button class="tab" data-tab="seedance" data-group="video">Video&nbsp;prompt</button>
              <button class="tab" data-tab="kling-advisor" data-group="video">Kling&nbsp;V2V</button>
              <button class="tab" data-tab="characters" data-group="assets">Assets</button>
            </div>
          </nav>
          <!-- Scenes: General, then the project's own (scenes.js). Picks the chat in a gem tab, tags new images, filters the Library. -->
          <div class="scene-strip hidden" id="sceneStrip"></div>
        </header>

        <section class="ws-body" id="wsBody"><!-- panels injected --></section>
      </div>

      <!-- Global Showcase admin (uploads that power the public landing page) -->
      <div class="showcase-view hidden" id="showcaseView"></div>

      <!-- Global Expenses view (running Claude + Nano Banana cost, by month/week) -->
      <div class="showcase-view hidden" id="expensesView"></div>

      <!-- Global CRM (leads from shyow.io/commercials + ones added by hand) -->
      <div class="showcase-view hidden" id="crmView"></div>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox hidden" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav prev hidden" id="lightboxPrev" title="Previous (←)">‹</button>
    <img id="lightboxImg" src="" alt="" />
    <button class="lightbox-nav next hidden" id="lightboxNext" title="Next (→)">›</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-count" id="lightboxCount"></div>
  </div>

  <!-- Sign-in overlay — shown only when Google sign-in is required (auth enabled). -->
  <div class="auth-overlay hidden" id="authOverlay">
    <div class="auth-card">
      <div class="auth-mark">◐</div>
      <div class="auth-name">AI&nbsp;VIDEO&nbsp;STUDIO</div>
      <div class="auth-sub">Private studio — invited Google accounts only.</div>
      <button class="auth-google hidden" id="googleSignInBtn">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <div class="auth-status" id="authStatus">Loading…</div>
      <button class="auth-signout hidden" id="authSignOut">Use a different account</button>
    </div>
  </div>

  <script src="/app.js?v=42" type="module"></script>
</body>
</html>
